<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lost: My Motivation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>

  <body>
    <div class="container">

      <h1 class="display-1 text-center text-danger">
        LOST: Number 7
      </h1>

      <p class="text-center text-muted fs-4 border border-2 border-warning rounded p-3">
        Last seen on the plantet Earth.
      </p>

      <div id="carouselExampleDark" class="carousel carousel-dark slide mb-5">
        <div class="carousel-indicators">
          <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="0" class="active"></button>
          <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="1"></button>
          <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="2"></button>
        </div>

        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="gurt.png" class="d-block w-100" alt="bumnumb7">
          </div>
          <div class="carousel-item">
            <img src="gurt2.jpg" class="d-block w-100" alt="gury6" width="200" height="200">
          </div>
          <div class="carousel-item">
            <img src="gurt3.jpg" class="d-block w-100" alt="gvdfdfg">
          </div>
        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleDark" data-bs-slide="prev">
          <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleDark" data-bs-slide="next">
          <span class="carousel-control-next-icon"></span>
        </button>
      </div>

      <div class="text-center mb-5">
        <a href="https://www.google.com/search?q=google+thank+you+image&safe=active&ssui=on" class="btn btn-success btn-lg active">
          I Found It!
        </a>

        <a href="https://www.google.com" class="btn btn-secondary btn-lg disabled">
          Still Missing
        </a>
      </div>

      <div class="border border-3 border-info rounded p-4">
        <h3 class="text-primary">Report a Sighting</h3>

        <form>
          <div class="mb-3">
            <label class="form-label">Your Name</label>
            <input type="text" class="form-control" placeholder="Enter your name">
          </div>

          <div class="mb-3">
            <label class="form-label">Where did you see my number 7?</label>
            <select class="form-select">
              <option>In the woods</option>
              <option>On TikTok</option>
              <option>On Earth</option>
              <option>Never</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Anything else?</label>
            <textarea class="form-control" rows="3"></textarea>
          </div>

          <button type="submit" class="btn btn-danger">
            Submit Report
          </button>
        </form>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
